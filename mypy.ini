[mypy]
python_version = 3.11
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
# Проверяем только явно указанные модули; ошибки в импортируемых из них
# модулях handlers/ не всплывают при `mypy services config core database bot.py`.
# Обработчики разбираются отдельным проходом (им соответствуют helpers
# handlers/common/typing.py).
follow_imports = silent
